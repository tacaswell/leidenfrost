networkx = ">=3.6.1,<4"
ipython = ">=9.9.0,<10"
pyzmq = ">=27.1.0,<28"
future = ">=1.0.0,<2"
h5py = ">=3.15.1,<4"
parse = ">=1.20.2,<2"
trackpy = ">=0.7,<0.8"
ipyparallel = ">=9.0.2,<10"


[pypi-dependencies]
leidenfrost = { path = ".", editable = true }
