[workspace]
authors = ["Thomas A Caswell <tcaswell@gmail.com>"]
channels = ["conda-forge"]
name = "leidenfrost"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.2,<3.15"
matplotlib = ">=3.10.8,<4"
pyside6 = ">=6.10.1,<7"
